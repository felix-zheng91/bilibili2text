services:
  backend:
    image: ${B2T_BACKEND_IMAGE:-bilibili-to-text:latest}
    build:
      context: .
      target: backend
      args:
        APP_UID: ${B2T_UID:-1000}
        APP_GID: ${B2T_GID:-1000}
    environment:
      B2T_WEB_UI_MODE: ${B2T_WEB_UI_MODE:-default}
      TZ: ${B2T_TIMEZONE:-Asia/Shanghai}
    user: "${B2T_UID:-1000}:${B2T_GID:-1000}"
    expose:
      - "8000"
    volumes:
      - type: bind
        source: ${B2T_CONFIG_PATH:-./config.toml}
        target: /app/config.toml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${B2T_SUMMARY_PRESETS_PATH:-./summary_presets.toml}
        target: /app/summary_presets.toml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${B2T_CONTEXT_PATH:-./context.toml}
        target: /app/context.toml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${B2T_TRANSCRIPTIONS_DIR:-./transcriptions}
        target: /app/transcriptions
        bind:
          create_host_path: false
      - type: bind
        source: ${B2T_DB_DIR:-./db_data}
        target: /app/db_data
        bind:
          create_host_path: false
      - type: bind
        source: ${B2T_CHROMA_DIR:-./chroma_data}
        target: /app/chroma_data
        bind:
          create_host_path: false
      # yutto 登录态由容器生成并保存在 Docker named volume 中。
      - type: volume
        source: yutto_config
        target: /home/appuser/.config
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    image: ${B2T_FRONTEND_IMAGE:-bilibili-to-text-web:latest}
    build:
      context: .
      target: frontend
    environment:
      FRONTEND_PORT: "80"
      BACKEND_HOST: backend
      BACKEND_PORT: "8000"
      TZ: ${B2T_TIMEZONE:-Asia/Shanghai}
    ports:
      - "${B2T_FRONTEND_PORT:-6010}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  yutto_config:
